name: Complete Edition
on:
  push:
    branches: [complete-edition-development, qa-reconcile-20261016]
  pull_request:
    branches: [complete-edition-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Complete Edition event placements and gates
        run: python3 tools/complete_edition/validate.py
      - name: Verify release patch integrity
        run: python3 -m unittest discover -s tools/complete_edition -p 'test_bps.py' -v
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Verify native-log classification
        run: python3 -m unittest discover -s tools/complete_edition -p 'test_summarize_tests.py' -v
      - name: Build
        run: ./tools/complete_edition/build.sh
      - name: Affected candidate native families
        if: github.ref_name == 'qa-reconcile-20261016'
        run: bash tools/complete_edition/test-candidate.sh
      - name: Complete Edition native regressions
        run: ./tools/complete_edition/test.sh --ce-only
      - name: Full native regression audit in headless mGBA
        run: ./tools/complete_edition/test.sh --full
      - name: Prepare tested development build
        run: |
          mkdir -p build/complete-edition-playable
          cp pokeemerald.gba build/complete-edition-playable/CompleteEdition.gba
          printf '%s\n' "$GITHUB_SHA" > build/complete-edition-playable/SOURCE_COMMIT.txt
          printf '%s\n' 'Pokemon Emerald: Complete Edition - tested development build' 'Automated checks passed for the source commit recorded in SOURCE_COMMIT.txt.' 'Ordinary story/postgame certification and dedicated portrait work remain unfinished.' 'Back up your Alpha 2 battery save before upgrading. Alpha 1/original saves are incompatible.' > build/complete-edition-playable/README.txt
          cd build/complete-edition-playable
          sha256sum CompleteEdition.gba > SHA256SUMS
      - name: Upload tested development build
        uses: actions/upload-artifact@v4
        with:
          name: complete-edition-tested-development
          path: build/complete-edition-playable/
          if-no-files-found: error
      - name: Save verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-edition-verification
          path: build/complete-edition-logs/

